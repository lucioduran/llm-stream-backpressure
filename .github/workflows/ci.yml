name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.8.23'
          enable-cache: false
      - name: Install pinned Python
        shell: bash
        run: |
          uv venv --python 3.12.11 --seed .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-build-isolation
      - run: ruff check src tests experiments
      - run: ruff format --check src tests experiments
      - run: mypy
      - run: python -m unittest discover -s tests -v
      - run: python experiments/replay.py
      - run: python -m build --wheel --no-isolation
      - name: Installed wheel smoke and regression suite
        shell: bash
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install --no-deps dist/*.whl
          wheel-env/bin/python -m unittest discover -s tests -v
          wheel-env/bin/python -c 'import asyncio; from stream_backpressure import Server, SyntheticProvider, consume; print("Wheel import successful")'

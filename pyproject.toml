[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-stream-backpressure"
version = "0.1.0"
description = "Bounded local SSE streaming and honest cancellation experiments"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{name = "Lucho Duran"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.4", "mypy==1.18.2", "build==1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/stream_backpressure"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
files = ["src"]
